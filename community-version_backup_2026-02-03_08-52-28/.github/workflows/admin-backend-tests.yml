name: Admin Backend Tests

on:
  push:
    paths:
      - 'admin/backend/**'
      - '.github/workflows/admin-backend-tests.yml'
  pull_request:
    paths:
      - 'admin/backend/**'
      - '.github/workflows/admin-backend-tests.yml'
  workflow_dispatch:

jobs:
  test:
    name: Run Tests and Generate Coverage
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install
        # Note: Using npm install instead of npm ci because root package-lock.json needs to be synced with workspace package.json files

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: ./admin/backend
        env:
          DATABASE_URL: 'postgresql://test:test@localhost:5432/test?schema=public'

      - name: Run linter
        run: npm run lint
        working-directory: ./admin/backend
        continue-on-error: true

      - name: Run tests with coverage
        id: tests
        run: npm test 2>&1 | tee test-output.txt
        working-directory: ./admin/backend
        env:
          JWT_SECRET: 'test-jwt-secret-for-ci'
          CRAWLING_SERVICE_URL: 'http://localhost:3001'
          CRON_SCHEDULER_URL: 'http://localhost:3002'
          INSTANCE_SERVICE_URL: 'http://localhost:3006'
          VERSION_TYPE: 'opensource'
          FEATURE_BILLING: 'true'
          FEATURE_ENTERPRISE: 'true'
          FEATURE_ADVANCED_ANALYTICS: 'false'
          FEATURE_PREMIUM_AI_MODELS: 'false'
          FEATURE_ADMINJS_DASHBOARD: 'false'
          OPENAI_API_KEY: 'test-key'
        continue-on-error: true

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./admin/backend/coverage/lcov.info
          flags: admin-backend
          name: admin-backend-coverage
          fail_ci_if_error: false

      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-backend-coverage-report
          path: |
            admin/backend/coverage/
          retention-days: 30

      - name: Generate Test Results Summary
        if: always()
        uses: ./.github/actions/generate-test-summary
        with:
          test-output-file: 'admin/backend/test-output.txt'
          coverage-file: 'admin/backend/coverage/lcov.info'
