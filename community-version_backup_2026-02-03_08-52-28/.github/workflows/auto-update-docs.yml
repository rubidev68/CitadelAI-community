name: Auto Update Documentation

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - '**.md'
      - 'documentation/**'
      - '.github/**'
  pull_request:
    branches:
      - main
      - dev
    paths-ignore:
      - '**.md'
      - 'documentation/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-documentation:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
      
      - name: Generate Changelog
        id: changelog
        run: |
          echo "📝 Generating changelog from recent commits..."
          if [ -f "scripts/generate-changelog.sh" ]; then
            chmod +x scripts/generate-changelog.sh
            ./scripts/generate-changelog.sh || echo "⚠️ Changelog generation failed"
          else
            echo "⚠️ Changelog generation script not found"
          fi
      
      - name: Update Version Information
        run: |
          echo "📚 Updating version information in documentation..."
          
          # Get current version
          if [ -f ".version" ]; then
            VERSION=$(cat .version | tr -d '\n')
            echo "Current version: $VERSION"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "⚠️ .version file not found"
            VERSION="1.0.70"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi
          
          # Update documentation README version
          if [ -f "documentation/README.md" ]; then
            sed -i "s/\*\*Platform Version\*\*:.*/\*\*Platform Version\*\*: $VERSION/" documentation/README.md || true
            sed -i "s/\*\*Last Updated\*\*:.*/\*\*Last Updated\*\*: $(date +'%B %Y')/" documentation/README.md || true
          fi
          
          # Update main README last updated date
          if [ -f "README.md" ]; then
            sed -i "s/\*Last updated:.*/\*Last updated: $(date +'%B %Y')/" README.md || true
          fi
      
      - name: Check for Changes
        id: changes
        run: |
          git diff --quiet documentation/ README.md CHANGELOG.md || echo "has_changes=true" >> $GITHUB_OUTPUT
          git diff --quiet documentation/ README.md CHANGELOG.md && echo "has_changes=false" >> $GITHUB_OUTPUT || true
      
      - name: Commit Documentation Updates
        if: steps.changes.outputs.has_changes == 'true' && github.event_name == 'push'
        run: |
          echo "📝 Committing documentation updates..."
          git add documentation/README.md README.md CHANGELOG.md || true
          
          # Check if there are changes to commit
          if ! git diff --staged --quiet; then
            git commit -m "docs: auto-update documentation for version ${{ steps.changelog.outputs.version || 'latest' }}
            
            - Updated version information
            - Generated changelog from recent commits
            - Synchronized documentation with codebase changes
            
            [skip ci]" || echo "No changes to commit"
            
            git push origin ${{ github.ref_name }} || echo "Push failed or no changes"
          else
            echo "No documentation changes to commit"
          fi
      
      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true' && github.event_name == 'pull_request'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: auto-update documentation for version ${{ steps.changelog.outputs.version || 'latest' }}"
          title: "📚 Auto-update Documentation"
          body: |
            ## 📚 Automatic Documentation Update
            
            This PR automatically updates documentation based on recent code changes.
            
            ### Changes:
            - ✅ Updated version information
            - ✅ Generated changelog from recent commits
            - ✅ Synchronized documentation with codebase
            
            ### Version: ${{ steps.changelog.outputs.version || 'latest' }}
            
            ---
            *This PR was automatically created by GitHub Actions*
          branch: auto-update-docs-${{ github.run_number }}
          delete-branch: true
