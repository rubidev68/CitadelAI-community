name: Validate Community Migration

on:
  pull_request:
    paths:
      - 'scripts/migrate-to-community*.sh'
      - 'scripts/validate-community-edition*.sh'
      - 'scripts/migration-helpers.sh'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate Migration Scripts
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Check dependencies
        run: |
          chmod +x scripts/check-dependencies.sh
          ./scripts/check-dependencies.sh
          
      - name: Validate script syntax
        run: |
          bash -n scripts/migrate-to-community-enhanced.sh || bash -n scripts/migrate-to-community.sh
          bash -n scripts/validate-community-edition-enhanced.sh || bash -n scripts/validate-community-edition.sh
          bash -n scripts/migration-helpers.sh
          
      - name: Test dry-run mode
        run: |
          chmod +x scripts/migrate-to-community-enhanced.sh
          ./scripts/migrate-to-community-enhanced.sh --dry-run || true
          
      - name: Upload migration log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-logs
          path: |
            .migration-log-*.txt
            .validation-log-*.txt
          retention-days: 7
