name: User Backend Tests

on:
  push:
    paths:
      - 'user/backend/**'
      - '.github/workflows/user-backend-tests.yml'
  pull_request:
    paths:
      - 'user/backend/**'
      - '.github/workflows/user-backend-tests.yml'
  workflow_dispatch:

jobs:
  test:
    name: Run Tests and Generate Coverage
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install
        # Note: Using npm install instead of npm ci because root package-lock.json needs to be synced with workspace package.json files

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: ./user/backend
        env:
          DATABASE_URL: 'postgresql://test:test@localhost:5432/test?schema=public'

      - name: Run linter
        run: npm run lint
        working-directory: ./user/backend
        continue-on-error: true

      - name: Run tests with coverage
        id: tests
        run: npm test 2>&1 | tee test-output.txt
        working-directory: ./user/backend
        env:
          NODE_ENV: 'test'
          JWT_SECRET: 'test-jwt-secret-for-ci'
          GEMINI_API_KEY: 'test-gemini-key'
          OPENAI_API_KEY: 'test-openai-key'
          ANTHROPIC_API_KEY: 'test-anthropic-key'
          MISTRAL_API_KEY: 'test-mistral-key'
          WEAVIATE_URL: 'http://localhost:8080'
          DATABASE_URL: 'postgresql://test:test@localhost:5432/test?schema=public'
        continue-on-error: true

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./user/backend/coverage/lcov.info
          flags: user-backend
          name: user-backend-coverage
          fail_ci_if_error: false

      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: user-backend-coverage-report
          path: |
            user/backend/coverage/
          retention-days: 30

      - name: Generate Test Results Summary
        if: always()
        uses: ./.github/actions/generate-test-summary
        with:
          test-output-file: 'user/backend/test-output.txt'
          coverage-file: 'user/backend/coverage/lcov.info'
